name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Quirzy
        run: flutter pub get

      - name: Analyze
        working-directory: Quirzy
        run: flutter analyze --no-fatal-infos

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Quirzy
        run: flutter pub get

      - name: Decode keystore
        working-directory: Quirzy/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: Quirzy/android
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        working-directory: Quirzy
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: Quirzy/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Quirzy
        run: flutter pub get

      - name: Decode keystore
        working-directory: Quirzy/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: Quirzy/android
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK (fat)
        working-directory: Quirzy
        run: flutter build apk --release

      - name: Build release APK (split)
        working-directory: Quirzy
        run: flutter build apk --release --split-per-abi

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ExamAI ${{ steps.version.outputs.VERSION }}
          body: |
            ## ExamAI ${{ steps.version.outputs.VERSION }}

            ### What's new
            - Smart notification system (SRS reminders, streak protection, exam countdown)
            - Mock Test mode for JEE, NEET, CAT and more
            - Study Material generator (Summary + Flashcards + Quiz)
            - Rank Predictor after every mock test
            - Spaced Repetition (SM-2) for flashcards

            ### Downloads
            - `app-arm64-v8a-release.apk` — most modern Android phones (recommended)
            - `app-armeabi-v7a-release.apk` — older 32-bit phones
            - `app-x86_64-release.apk` — emulators
            - `app-release.apk` — universal (larger, works on all devices)
          files: |
            Quirzy/build/app/outputs/flutter-apk/app-release.apk
            Quirzy/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            Quirzy/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            Quirzy/build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
